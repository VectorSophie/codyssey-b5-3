{% extends "base.html" %}
{% block content %}
<h1>{{ book.title }}</h1>
<p>저자: {{ book.author }}</p>
<p>재고: {{ book.available_copies }} / {{ book.total_copies }}</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/books/{{ book.id }}/rent">
  <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
  <button type="submit" {% if book.available_copies <= 0 %}disabled{% endif %}>대여하기</button>
</form>
<p><a href="/books">목록으로</a></p>
{% endblock %}
