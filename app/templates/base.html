<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>도서 대여 서비스</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #222; }
    nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid #ddd; padding-bottom: 12px; }
    nav a { margin-left: 12px; }
    table { border-collapse: collapse; width: 100%; margin-top: 12px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    button { cursor: pointer; }
    .error { color: #c0392b; }
    .status-대여중 { color: #d35400; font-weight: bold; }
    .status-반납완료 { color: #27ae60; }
    form.inline { display: inline; }
  </style>
</head>
<body>
  <nav>
    <a href="/"><strong>도서 대여 서비스</strong></a>
    <div>
      {% if member %}
        <span>{{ member.name }}님 환영합니다</span>
        <a href="/books">도서 목록</a>
        <a href="/rentals">내 대여 목록</a>
        <form class="inline" action="/logout" method="post">
          <button type="submit">로그아웃</button>
        </form>
      {% else %}
        <a href="/login">로그인</a>
      {% endif %}
    </div>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
